name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache pet animation assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/webp
            anim-map.json
            app/src/main/assets/pet-config.json
          key: ${{ runner.os }}-pet-webp-0.3.8-${{ hashFiles('tools/build-assets.mjs', 'tools/gen-config.mjs') }}

      - name: Restore animation assets
        run: |
          chmod +x tools/fetch-and-transcode.sh gradlew
          ./tools/fetch-and-transcode.sh

      - name: Build debug APK
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-pet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
