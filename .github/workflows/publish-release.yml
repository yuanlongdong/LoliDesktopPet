name: Publish APK Release
on:
  workflow_run:
    workflows: ["build-apk"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: desk-pet-debug-apk
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify APK exists
        run: test -n "$(find release-assets -type f -name '*.apk' -print -quit)"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.workflow_run.head_sha }}
          name: Android 桌宠 APK ${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            自动发布的 Android 桌宠调试版 APK。
            构建提交：${{ github.event.workflow_run.head_sha }}
            构建记录：${{ github.event.workflow_run.html_url }}
          draft: false
          prerelease: true
          files: release-assets/**/*.apk
