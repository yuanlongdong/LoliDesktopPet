name: Android build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoliDesktopPet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish or update v0.1.2 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/douyin-live-interaction' && contains(github.event.head_commit.message, 'Publish v0.1.2 release')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Android debug APK v0.1.2 (app version 1.8.2). Fixes invisible pet behavior by drawing a bundled vector fallback when animated WebP assets are absent. This fallback keeps the pet visible and touchable; full character animation still requires the original WebP animation pack. Real Douyin event ingestion is not connected."
          if gh release view v0.1.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.2 app/build/outputs/apk/debug/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit v0.1.2 --repo "${GITHUB_REPOSITORY}" --title "Loli Desktop Pet v0.1.2" --notes "${NOTES}"
          else
            gh release create v0.1.2 app/build/outputs/apk/debug/*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Loli Desktop Pet v0.1.2" \
              --notes "${NOTES}" \
              --latest
          fi
