name: Android build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoliDesktopPet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish or update v0.1.1 GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/douyin-live-interaction' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/douyin-live-interaction') && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/feature/douyin-live-interaction'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if gh release view v0.1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.1 app/build/outputs/apk/debug/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit v0.1.1 --repo "${GITHUB_REPOSITORY}" --title "Loli Desktop Pet v0.1.1" --notes "Android debug build. Includes live-interaction event bridge and fixes for missing drawable and sound resources. Real Douyin live event ingestion is not connected; official platform authorization is still required."
          else
            gh release create v0.1.1 app/build/outputs/apk/debug/*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET_SHA}" \
              --title "Loli Desktop Pet v0.1.1" \
              --notes "Android debug build. Includes live-interaction event bridge and fixes for missing drawable and sound resources. Real Douyin live event ingestion is not connected; official platform authorization is still required." \
              --latest
          fi
