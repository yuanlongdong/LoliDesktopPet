name: Android build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore original upstream animation assets
        run: WIDTH=300 QUALITY=50 FPS=15 bash tools/fetch-and-transcode.sh

      - name: Verify all 106 original animations were restored
        shell: bash
        run: |
          count="$(find app/src/main/assets/webp -maxdepth 1 -type f -name 'a*.webp' | wc -l)"
          echo "Animation WebP count: $count"
          test "$count" -eq 106

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK includes all original animations
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          count="$(unzip -Z1 "$apk" | grep -Ec '^assets/webp/a[0-9]{3}\.webp$' || true)"
          echo "Animations packaged in APK: $count"
          test "$count" -eq 106
          size="$(stat -c%s "$apk")"
          echo "APK size: $size bytes"
          test "$size" -gt 20000000

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoliDesktopPet-debug-apk-with-original-animations
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or update v0.1.3 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/douyin-live-interaction' && contains(github.event.head_commit.message, 'Publish v0.1.3 release')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Android debug APK v0.1.3 (app version 1.8.2). Restores and packages all 106 original transparent animations from upstream dsh-pet at 300px/15fps during CI. No generated placeholder character is used. Animation assets are from PC2005-cloud/dsh-pet and are permitted for open-source use but not commercial use; see NOTICE.md. Real Douyin event ingestion is not connected."
          if gh release view v0.1.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.3 app/build/outputs/apk/debug/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit v0.1.3 --repo "${GITHUB_REPOSITORY}" --title "Loli Desktop Pet v0.1.3 · Original animations" --notes "${NOTES}"
          else
            gh release create v0.1.3 app/build/outputs/apk/debug/*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Loli Desktop Pet v0.1.3 · Original animations" \
              --notes "${NOTES}" \
              --latest
          fi
